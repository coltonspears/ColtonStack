# The compiler is the first gate; CI is the second. TreatWarningsAsErrors and the
# BannedApiAnalyzers already fail the build locally — this workflow makes that a merge gate.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ColtonStack.sln

      - name: Build (warnings are errors, banned APIs are errors)
        run: dotnet build ColtonStack.sln --no-restore --nologo

      - name: Test
        run: dotnet test ColtonStack.sln --no-build --nologo --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/results.trx'
          if-no-files-found: ignore
